[package]
name = "kriuk"
version = "0.3.7"
description = "Kriuk - tray audio utility"
edition = "2021"
rust-version = "1.77"

[dependencies]
cpal = "0.15"
nnnoiseless = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.24.0"
rustfft = "6"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
egui = "0.29"
egui-winit = "0.29"
egui_glow = "0.29"
glow = "0.14"
raw-window-handle = "0.6"
tray-icon = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
