name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # prose and CI edits do not need a compile; tags ignore path filters
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release.ps1 walks back to the previous tag, so it needs the history
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Stage
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri\target\release\kriuk.exe dist\Kriuk.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Kriuk-windows-x64
          path: dist/Kriuk.exe

      # Tagging v* publishes the same exe. The body is built from the commits
      # since the previous tag, with docs and chores dropped; a tag that carries
      # nothing user-facing is skipped instead of shipping an empty release.
      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $sha = (Get-FileHash dist/Kriuk.exe -Algorithm SHA256).Hash.ToLower()
          ./.github/release.ps1 -Tag $env:GITHUB_REF_NAME -Out release.md -Sha $sha -Repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 2) { 'skip=true' >> $env:GITHUB_OUTPUT }
          elseif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = 'Kriuk ' + ($env:GITHUB_REF_NAME -replace '^v', '')
          gh release create $env:GITHUB_REF_NAME dist/Kriuk.exe --title $title --notes-file release.md

      - name: Skip empty release
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.skip == 'true'
        run: echo "::warning::No user-facing commits since the last tag. Tag kept, nothing published."
