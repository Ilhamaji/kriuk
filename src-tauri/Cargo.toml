[package]
name = "kriuk"
version = "0.2.2"
description = "Kriuk - tray audio utility"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
cpal = "0.15"
nnnoiseless = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.24.0"
rustfft = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
