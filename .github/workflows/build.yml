name: build

# Pushing builds and uploads the exe. Publishing a release is a separate,
# deliberate action: Actions -> build -> Run workflow, with the tag to ship.
on:
  push:
    branches: [main]
    tags: ['v*']
    # prose and CI edits do not need a compile; tags ignore path filters
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (empty = build only, nothing published)
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the notes walk back to the last release, so they need the history
          fetch-depth: 0

      - name: Check out the tag to publish
        id: target
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'.Trim()
          git rev-parse --verify "$tag^{commit}" | Out-Null
          git checkout --force $tag
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "publishing $tag at $(git rev-parse --short HEAD)"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Stage
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri\target\release\kriuk.exe dist\Kriuk.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Kriuk-windows-x64
          path: dist/Kriuk.exe

      # The body covers every commit since the last published release, so a tag
      # that was built but never shipped lands in the next release instead of
      # being lost. Docs and chores are dropped.
      - name: Release notes
        id: notes
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.target.outputs.tag }}'
          $from = gh release list --limit 1 --json tagName --jq '.[0].tagName'
          # re-running a tag that is already out is a no-op, not a failure
          if ($from -eq $tag) {
            "::warning::$tag is already published. Nothing to do."
            'skip=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $sha = (Get-FileHash dist/Kriuk.exe -Algorithm SHA256).Hash.ToLower()
          ./.github/release.ps1 -Tag $tag -From $from -Out release.md -Sha $sha -Repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 2) { 'skip=true' >> $env:GITHUB_OUTPUT }
          elseif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && steps.notes.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.target.outputs.tag }}'
          $title = 'Kriuk ' + ($tag -replace '^v', '')
          gh release create $tag dist/Kriuk.exe --title $title --notes-file release.md

      - name: Skip empty release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && steps.notes.outputs.skip == 'true'
        run: echo "::warning::Nothing published for this tag."
